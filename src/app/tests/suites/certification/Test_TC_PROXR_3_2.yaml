          FeatureMap with no runtime setter. The BLTCS security level and mode are additionally hardcoded
          (Three / Both) at LoggingRangingAdapter.cpp:335-336. Observed reads: both THs report
          BLTCSSecurityLevel=3, BLTCSModeCapability=2. No chip-tool command exists for this step.
      disabled: true

