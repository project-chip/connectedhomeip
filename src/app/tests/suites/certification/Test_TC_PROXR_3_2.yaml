      PICS: PROXR.C
      verification: |
          Product maker needs to provide instructions for how to trigger the command on the DUT. For comparison, the DUT behavior for this test step can be simulated using chip-tool (when DUT is a commissioner/Client)

              $CT proximityranging read bltdev-ik            0x11 1 --storage-directory $SD
              $CT proximityranging read bltcssecurity-level  0x11 1 --storage-directory $SD
              $CT proximityranging read bltcsmode-capability 0x11 1 --storage-directory $SD
              (repeat for 0x22; record both BLTDevIK values for step 9)

          Observed:

              BLTDevIK (TH_I): B895063C772EC49FC89855852E34A78C
              BLTDevIK (TH_R): E434DF0871C7FADF3B5457BD6F98A9B8
