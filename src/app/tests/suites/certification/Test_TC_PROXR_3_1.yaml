# Auto-generated scripts for harness use only, please review before automation. The endpoints and cluster names are currently set to default

name: 3.1. [TC-PROXR-3.1] Trigger Instant Proximity Ranging (DUT as Client)

PICS:
    - PROXR.C

config:
    nodeId: 0x12344321
    cluster: "Proximity Ranging"
    endpoint: 1

tests:
    - label: "Note"
      verification: |
          The DUT is a Proximity Ranging client (commissioner). The chip-tool commands below stand in for the
          DUT's client behaviour so a tester can compare the DUT against a known-good invocation. For
          certification, the product maker must provide a way to trigger the equivalent behaviour on the DUT.

          Two TH server instances are needed (TH_I initiator, TH_R reflector), plus a controller acting as the
          DUT stand-in. Reference setup (all-devices-app is the only example exposing ProximityRanging):

              APP=<path>/all-devices-app
              CT=<path>/chip-tool
              SD=/tmp/pr_ctl            # create before first use: mkdir -p $SD
              $APP --device proximity-ranger:1 --discriminator 3841 --port 5541 --KVS /tmp/pr_thi_kvs.ini   # TH_I
              $APP --device proximity-ranger:1 --discriminator 3842 --port 5542 --KVS /tmp/pr_thr_kvs.ini   # TH_R

          NOTE: this app build has no --passcode flag and uses --port (not --secured-device-port); both instances
          use the default passcode 20202021 and must be paired BY DISCRIMINATOR.

          The RangingResult EventNumbers shown in later steps are session-relative to the reference run (they
          increment across all sessions on that TH instance); compare the RangingResult PAYLOAD, not the exact
          EventNumber value.
      disabled: true

    - label: "Step 1: Commission TH_I and TH_R to DUT."
      verification: |
          Product maker needs to provide instructions for how to trigger the command on the DUT. For comparison, the DUT behavior for this test step can be simulated using chip-tool (when DUT is a commissioner/Client)

              $CT pairing onnetwork-long 0x11 20202021 3841 --storage-directory $SD    # TH_I
              $CT pairing onnetwork-long 0x22 20202021 3842 --storage-directory $SD    # TH_R

          Verify both commissionings succeed on the controller (DUT stand-in) log:

              [TOO] Device commissioning completed with success
      disabled: true

    - label:
          "Step 2: Enable the WFUSDPD feature and configure the Technology to
          WiFiRoundTripTimeRanging and disable other Proximity Ranging features
          on TH_I and TH_R."
      verification: |
          NOT VERIFIABLE against the reference all-devices-app. The example TH cannot present a single-feature
          FeatureMap: LoggingProximityRanger's constructor hardcodes all three ranging adapters
          (examples/all-devices-app/all-devices-common/device/types/proximity-ranger/impl/LoggingProximityRanger.cpp:28-34)
          and ProximityRanger::DeriveFeatures() computes the FeatureMap from those adapters with no runtime setter
          (examples/all-devices-app/all-devices-common/device/types/proximity-ranger/ProximityRanger.h:64-73). Only
          a build-time switch (device-factory/enabled_devices.gni) exists. A step-3 read returns
          RangingCapabilities with 3 entries (WiFi + BLTCS + BLERBC all present), so "disable other features"
          is not truthfully representable on this app. The server still accepts a WiFi-only StartRangingRequest,
          so steps 3-6 can be driven; the precondition just cannot be enforced. No chip-tool command exists for
          this step.
      disabled: true

    - label: "Step 3: Trigger DUT to read all attributes from TH_I and TH_R."
      PICS: PROXR.C
      verification: |
          Product maker needs to provide instructions for how to trigger the command on the DUT. For comparison, the DUT behavior for this test step can be simulated using chip-tool (when DUT is a commissioner/Client)

              $CT proximityranging read ranging-capabilities 0x11 1 --storage-directory $SD
              $CT proximityranging read wi-fi-dev-ik         0x11 1 --storage-directory $SD
              $CT proximityranging read session-idlist       0x11 1 --storage-directory $SD
              (repeat for 0x22; record both WiFiDevIK values for step 4)

          Verify the DUT discovers both THs and obtains their attributes. Observed reads (values are per-device;
          the WiFiDevIK of each TH becomes the PeerWiFiDevIK the DUT must cross-send in step 4):

              RangingCapabilities: 3 entries
                  Technology: 1  FrequencyBand: 13  Bandwidth: 0  SupportedRangingRoles: 3
                  PeriodicRangingSupport: TRUE  MaxConcurrentSessions: 4
                  Technology: 3 ...  (a common Technology across TH_I and TH_R is required)
              WiFiDevIK (TH_I): DBB1F234DF110D7D43D8273A9F008E83
              WiFiDevIK (TH_R): 77C0BF94E4B28FD157EB251360244C3B
              SessionIDList: 0 entries
      disabled: true

    - label:
          "Step 4: Trigger DUT to send StartRangingRequest to TH_I (subscriber)
          and TH_R (publisher), without the RangingInstanceInterval field."
      PICS: PROXR.C
      verification: |
          Product maker needs to provide instructions for how to trigger the command on the DUT. For comparison, the DUT behavior for this test step can be simulated using chip-tool (when DUT is a commissioner/Client)

          Technology positional = 1 (WiFiRoundTripTime). The PeerWiFiDevIK values are crossed (TH_I gets TH_R's
          key and vice-versa); the PMK is the same 32-byte value in both commands. Use a generous EndTime (60)
          so the Stop in step 6 lands inside the session window (see step 6).

              $CT proximityranging start-ranging-request 1 '{"startTime":0,"endTime":60}' 0x11 1 \
                --WiFiRangingDeviceRoleConfig '{"role":0,"peerWiFiDevIK":"hex:77C0BF94E4B28FD157EB251360244C3B","pmk":"hex:000102030405060708090A0B0C0D0E0F101112131415161718191A1B1C1D1E1F"}' \
                --storage-directory $SD
              $CT proximityranging start-ranging-request 1 '{"startTime":0,"endTime":60}' 0x22 1 \
                --WiFiRangingDeviceRoleConfig '{"role":1,"peerWiFiDevIK":"hex:DBB1F234DF110D7D43D8273A9F008E83","pmk":"hex:000102030405060708090A0B0C0D0E0F101112131415161718191A1B1C1D1E1F"}' \
                --storage-directory $SD

          Verify from the TH_I server log the received StartRangingRequest: CommandFields 0x0 = Technology (1),
          0x1 = WiFiRangingDeviceRoleConfig { 0x0 = role, 0x1 = peerWiFiDevIK, 0x2 = pmk }, 0x6 = trigger.
          The DUT's field values are readable in the InvokeRequestMessage pretty-print (octet strings print as
          full byte lists). "PMK common for both" = field 0x1/0x2 identical across the TH_I and TH_R logs.

          NOTE: this reference excerpt was captured with EndTime 30; the trigger EndTime field (0x1) echoes
          whatever EndTime you pass. TH_I log (WiFiSubscriber, peer = TH_R's WiFiDevIK):

              CHIP:DMG: InvokeRequestMessage =
              CHIP:DMG: {
              CHIP:DMG:   InvokeRequests =
              CHIP:DMG:   [
              CHIP:DMG:     CommandDataIB =
              CHIP:DMG:     {
              CHIP:DMG:       CommandPathIB = { EndpointId = 0x1, ClusterId = 0x433, CommandId = 0x0, },
              CHIP:DMG:       CommandFields =
              CHIP:DMG:       {
              CHIP:DMG:         0x0 = 1 (unsigned),
              CHIP:DMG:         0x1 =
              CHIP:DMG:         {
              CHIP:DMG:           0x0 = 0 (unsigned),
              CHIP:DMG:           0x1 = [ 0x77, 0xc0, 0xbf, 0x94, 0xe4, 0xb2, 0x8f, 0xd1, 0x57, 0xeb, 0x25, 0x13, 0x60, 0x24, 0x4c, 0x3b, ] (16 bytes)
              CHIP:DMG:           0x2 = [ 0x00, 0x01, 0x02, ... 0x1d, 0x1e, 0x1f, ] (32 bytes)
              CHIP:DMG:         },
              CHIP:DMG:         0x6 = { 0x0 = 0 (unsigned), 0x1 = 30 (unsigned), },
              CHIP:DMG:       },
              CHIP:DMG:     },
              CHIP:DMG:   ],
              CHIP:DMG: },
              CHIP:SVR: [LoggingRangingAdapter:WFUSDPD] PrepareSession id=1 tech=WiFiRoundTripTime
              CHIP:SVR: [LoggingRangingAdapter:WFUSDPD]   WiFiRoleConfig role=WiFiSubscriber peerWiFiDevIK.size=16 pmk=present

          TH_R log (WiFiPublisher, peer = TH_I's WiFiDevIK; PMK field 0x1/0x2 IDENTICAL to TH_I):

              CHIP:DMG:         0x1 = { 0x0 = 1 (unsigned),
              CHIP:DMG:                 0x1 = [ 0xdb, 0xb1, 0xf2, 0x34, ... 0x8e, 0x83, ] (16 bytes)
              CHIP:DMG:                 0x2 = [ 0x00, 0x01, ... 0x1f, ] (32 bytes) }
              CHIP:SVR: [LoggingRangingAdapter:WFUSDPD]   WiFiRoleConfig role=WiFiPublisher peerWiFiDevIK.size=16 pmk=present
              CHIP:SVR: [LoggingRangingAdapter:WFUSDPD] sid=1 passive responder role; will not emit measurements
      disabled: true

    - label:
          "Step 5: TH_I and TH_R each send a StartRangingResponse with a uint8
          SessionID."
      verification: |
          On the DUT stand-in (chip-tool) each start-ranging-request prints the response. Observed:

              Received Command Response Data, Endpoint=1 Cluster=0x0000_0433 Command=0x0000_0001
                StartRangingResponse: { sessionID: 1 }

          Both THs returned sessionID 1. The plan only says "an uint8 value" here, which is weaker than both the
          non-zero requirement in TC-PROXR-2.3/2.4 and the cluster definition, which constrains SessionID to
          min="1" on StartRangingResponse and StopRangingRequest
          (src/app/zap-templates/zcl/data-model/chip/proximity-ranging-cluster.xml:292,298). Treat a SessionID of
          0 as a failure. Record TH_R's SessionID for the Stop in step 6.
      disabled: true

    - label:
