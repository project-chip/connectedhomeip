          StopRangingRequest to TH_R with TH_R's SessionID."
      PICS: PROXR.C
      verification: |
          Product maker needs to provide instructions for how to trigger the command on the DUT. For comparison, the DUT behavior for this test step can be simulated using chip-tool (when DUT is a commissioner/Client)

              $CT proximityranging read-event ranging-result 0x11 1 --storage-directory $SD

          Verify the DUT obtains the RangingResult event (Distance 100 / ErrorMargin 10 / offset 1 are the
          stub's fixed constants; WiFiDevIK echoes the PEER's key):

              EventNumber = 0x0000000000000003
              RangingResult: { SessionID: 1
                RangingResultData: { WiFiDevIK: 77C0BF94E4B28FD157EB251360244C3B
                                     TimeOfMeasurementOffset: 1  Distance: 100  ErrorMargin: 10 } }

          Then the DUT sends StopRangingRequest to TH_R with TH_R's SessionID:

              $CT proximityranging stop-ranging-request 1 0x22 1 --storage-directory $SD

          Verify success on the DUT stand-in and the command on TH_R's log:

              Received Command Response Status for Endpoint=1 Cluster=0x0000_0433 Command=0x0000_0002 Status=0x0
              CHIP:DMG:  CommandId = 0x2, CommandFields = { 0x0 = 1 (unsigned), }   <- SessionID from TH_R
              CHIP:SVR: [LoggingRangingAdapter:WFUSDPD] StopSession id=1

          TIMING TRAP (observed): a StopRangingRequest issued AFTER the session EndTime has elapsed returns
          status 0xcb (INVALID_IN_STATE) / IM Error 0x000005CB. This is a CORRECT rejection, not a test failure.
          The DUT must send Stop inside the session window; use a generous EndTime (60) in step 4 for headroom.
      disabled: true

