name: 186.2.2. [TC-WASHERCTRL-2.2] Optional rinse attributes with DUT as Server

PICS:
    - WASHERCTRL.S.F01

config:
    nodeId: 0x12344321
    cluster: "Laundry Washer Controls"
    endpoint: 1

    NumberOfRinsesValue:
        type: enum8
        defaultValue: 1
    unsupportedNumberOfRinsesValue:
        type: enum8
        defaultValue: 3
    undefinedNumberOfRinsesValue:
        type: enum8
        defaultValue: 4

tests:
    - label: "Step 1: Commission DUT to TH"
      cluster: "DelayCommands"
      command: "WaitForCommissionee"
      arguments:
          values:
              - name: "nodeId"
                value: nodeId

    - label: "Step 2: TH reads from the DUT the the NumberOfRinses attribute"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002
      command: "readAttribute"
      attribute: "NumberOfRinses"
      response:
          saveAs: NumberOfRinsesValue
          constraints:
              type: enum8
              minValue: 0
              maxValue: 3

    - label: "Step 3: TH reads from the DUT the the SupportedRinses attribute"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0003
      command: "readAttribute"
      attribute: "SupportedRinses"
      response:
          saveAs: supportedRinses
          constraints:
              type: list
              maxLength: 4

    - label: "Qualify NumberOfRinses baseline: select supported None"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002 && WASHERCTRL.S.A0003
      runIf: NumberOfRinsesValue not in supportedRinses and 0 in supportedRinses
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: 0

    - label: "Qualify NumberOfRinses baseline: select supported Normal"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002 && WASHERCTRL.S.A0003
      runIf: >-
          NumberOfRinsesValue not in supportedRinses and 0 not in
          supportedRinses and 1 in supportedRinses
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: 1

    - label: "Qualify NumberOfRinses baseline: select supported Extra"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002 && WASHERCTRL.S.A0003
      runIf: >-
          NumberOfRinsesValue not in supportedRinses and 0 not in
          supportedRinses and 1 not in supportedRinses and 2 in supportedRinses
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: 2

    - label: "Qualify NumberOfRinses baseline: select supported Max"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002 && WASHERCTRL.S.A0003
      runIf: >-
          NumberOfRinsesValue not in supportedRinses and 0 not in
          supportedRinses and 1 not in supportedRinses and 2 not in
          supportedRinses and 3 in supportedRinses
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: 3

    - label:
          "Qualify NumberOfRinses baseline: verify and save supported readback"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002 && WASHERCTRL.S.A0003
      runIf: NumberOfRinsesValue not in supportedRinses
      command: "readAttribute"
      attribute: "NumberOfRinses"
      response:
          saveAs: NumberOfRinsesValue
          constraints:
              python: value in supportedRinses

    - label:
          "Step 4: TH writes a supported NumberOfRinses attribute to DUT within
          the range of the SupportedRinses list"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: NumberOfRinsesValue

    - label: "Wait 2 seconds"
      cluster: "DelayCommands"
      command: "WaitForMs"
      arguments:
          values:
              - name: "ms"
                value: 2000

    - label:
          "Step 5: after a few seconds, TH reads from the DUT the NumberOfRinses
          attribute"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002
      command: "readAttribute"
      attribute: "NumberOfRinses"
      response:
          value: NumberOfRinsesValue

    - label:
          "Step 6a: TH writes an unsupported NumberOfRinses attribute to DUT
          while DUT is not in a valid state."
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002 && WASHERCTRL.S.A0003
      runIf: >-
          0 not in supportedRinses and (unsupportedNumberOfRinsesValue == 0 or
          unsupportedNumberOfRinsesValue in supportedRinses or
          unsupportedNumberOfRinsesValue not in (0, 1, 2, 3))
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: 0
      response:
          error: INVALID_IN_STATE

    - label:
          "Step 6b: TH writes an unsupported NumberOfRinses attribute to DUT
          while DUT is not in a valid state."
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002 && WASHERCTRL.S.A0003
      runIf: >-
          1 not in supportedRinses and (unsupportedNumberOfRinsesValue == 1 or
          ((unsupportedNumberOfRinsesValue in supportedRinses or
          unsupportedNumberOfRinsesValue not in (0, 1, 2, 3)) and 0 in
          supportedRinses))
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: 1
      response:
          error: INVALID_IN_STATE

    - label:
          "Step 6c: TH writes an unsupported NumberOfRinses attribute to DUT
          while DUT is not in a valid state."
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002 && WASHERCTRL.S.A0003
      runIf: >-
          2 not in supportedRinses and (unsupportedNumberOfRinsesValue == 2 or
          ((unsupportedNumberOfRinsesValue in supportedRinses or
          unsupportedNumberOfRinsesValue not in (0, 1, 2, 3)) and all(value in
          supportedRinses for value in (0, 1))))
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: 2
      response:
          error: INVALID_IN_STATE

    - label:
          "Step 6d: TH writes an unsupported NumberOfRinses attribute to DUT
          while DUT is not in a valid state."
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002 && WASHERCTRL.S.A0003
      runIf: >-
          3 not in supportedRinses and (unsupportedNumberOfRinsesValue == 3 or
          ((unsupportedNumberOfRinsesValue in supportedRinses or
          unsupportedNumberOfRinsesValue not in (0, 1, 2, 3)) and all(value in
          supportedRinses for value in (0, 1, 2))))
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: 3
      response:
          error: INVALID_IN_STATE

    - label:
          "Step 7: TH reads NumberOfRinses unchanged after the rejected write"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002
      command: "readAttribute"
      attribute: "NumberOfRinses"
      response:
          value: NumberOfRinsesValue

    - label: "Step 8: TH writes an undefined NumberOfRinses enum value"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002
      command: "writeAttribute"
      attribute: "NumberOfRinses"
      arguments:
          value: undefinedNumberOfRinsesValue
      response:
          error: CONSTRAINT_ERROR

    - label:
          "Step 9: TH reads NumberOfRinses unchanged after the undefined write"
      PICS: WASHERCTRL.S.F01 && WASHERCTRL.S.A0002
      command: "readAttribute"
      attribute: "NumberOfRinses"
      response:
          value: NumberOfRinsesValue
