name: 88.2.1. [TC-DGGEN-2.1] Attributes [DUT as Server]

PICS:
    - DGGEN.S

config:
    nodeId: 0x12344321
    cluster: "General Diagnostics"
    endpoint: 0
    timeout: 14400

    TEST_EVENT_ENABLE_KEY:
        type: octet_string
        defaultValue: "hex:00112233445566778899aabbccddeeff"
    TEST_EVENT_TRIGGER_KEY:
        type: int64u
        defaultValue: "0x0000000000000003"
    payload:
        type: char_string
        defaultValue: "MT:-24J0AFN00KA0648G00"

tests:
    - label: "Step 1a: Reset Devices to factory defaults"
      PICS: PICS_SDK_CI_ONLY
      cluster: "SystemCommands"
      command: "FactoryReset"

    - label: "Step 1a: Reset Devices to factory defaults"
      PICS: PICS_USER_PROMPT
      verification: |
          Reset Devices to factory defaults
      cluster: "LogCommands"
      command: "UserPrompt"
      arguments:
          values:
              - name: "message"
                value: "Factory Reset the DUT and enter 'y' after success"
              - name: "expectedValue"
                value: "y"

    - label: "Step 1a: TH starts a commissioning process with DUT"
      cluster: "CommissionerCommands"
      command: "PairWithCode"
      arguments:
          values:
              - name: "nodeId"
                value: nodeId
              - name: "payload"
                value: payload

    - label: "Step 1b: Wait for the commissioned device to be retrieved"
      cluster: "DelayCommands"
      command: "WaitForCommissionee"
      arguments:
          values:
              - name: "nodeId"
                value: nodeId

    - label: "Step 2a: TH reads a RebootCount attribute value from DUT."
      PICS: DGGEN.S.A0001
      command: "readAttribute"
      attribute: "RebootCount"
      response:
          saveAs: boot_count1
          constraints:
              hasValue: true
              type: int16u
              minValue: 0
              maxValue: 1

    - label: "Step 2b: Reboot target device"
      PICS: PICS_SDK_CI_ONLY
      cluster: "SystemCommands"
      command: "Reboot"

    - label: "Step 2b: Reboot target device(DUT)"
      PICS: PICS_USER_PROMPT
      verification: |
          Did the DUT successfully reboot?
      cluster: "LogCommands"
      command: "UserPrompt"
      arguments:
          values:
              - name: "message"
                value: "Please reboot the DUT and enter 'y' after DUT starts"
              - name: "expectedValue"
                value: "y"

    - label: "Wait for the commissioned device to be retrieved"
      cluster: "DelayCommands"
      command: "WaitForCommissionee"
      arguments:
          values:
              - name: "nodeId"
                value: nodeId

    - label:
          "Step 2b: TH reads a RebootCount attribute value from DUT. Verify that
          boot_count2 is greater than boot_count1."
      PICS: DGGEN.S.A0001
      command: "readAttribute"
      attribute: "RebootCount"
      response:
          constraints:
              hasValue: true
              type: int16u
              minValue: boot_count1 + 1
              maxValue: 65535

    - label: "Step 3: TH reads NetworkInterfaces structure attribute from DUT."
      PICS: DGGEN.S.A0000
      command: "readAttribute"
      attribute: "NetworkInterfaces"
      response:
          constraints:
              hasValue: true
              type: list
              maxLength: 8

    - label: "Step 3: Verify the NetworkInterfaces fields against the DUT."
      PICS: PICS_USER_PROMPT && DGGEN.S.A0000
      verification: |
          Verify that each NetworkInterface struct describes the DUT's network interface:
              Name
              IsOperational
              OffPremiseServicesReachableIPv4
              OffPremiseServicesReachableIPv6
              HardwareAddress
              IPv4Addresses
              IPv6Addresses
              Type
      cluster: "LogCommands"
      command: "UserPrompt"
      arguments:
          values:
              - name: "message"
                value: "Please enter 'y' for success"
              - name: "expectedValue"
                value: "y"

    - label:
          "Step 4a: TH reads the Uptime attribute value of DUT. Store the value
          in uptime1"
      command: "readAttribute"
      attribute: "UpTime"
      response:
          saveAs: uptime1
          constraints:
              hasValue: true
              type: int64u

    - label: "Wait 10 seconds"
      cluster: "DelayCommands"
      command: "WaitForMs"
      arguments:
          values:
              - name: "ms"
                value: 10000

    - label:
          "Step 4b: TH reads a Uptime attribute value of DUT. Store the value in
          uptime2. Verify that uptime2 is greater than uptime1."
      command: "readAttribute"
      attribute: "UpTime"
      response:
          saveAs: uptime2
          constraints:
              hasValue: true
              type: int64u
              minValue: uptime1 + 1

    - label: "Step 4c: Reboot target device"
      PICS: PICS_SDK_CI_ONLY
      cluster: "SystemCommands"
      command: "Reboot"

    - label: "Step 4c:Reboot target device(DUT)"
      PICS: PICS_USER_PROMPT
      verification: |
          Did the DUT successfully reboot?
      cluster: "LogCommands"
      command: "UserPrompt"
      arguments:
          values:
              - name: "message"
                value: "Please reboot the DUT and enter 'y' after DUT starts"
              - name: "expectedValue"
                value: "y"

    - label: "Wait for the commissioned device to be retrieved"
      cluster: "DelayCommands"
      command: "WaitForCommissionee"
      arguments:
          values:
              - name: "nodeId"
                value: nodeId

    - label:
          "Step 4c: TH reads a Uptime attribute value of DUT. Store the value in
          uptime3. Verify that uptime3 is lesser than uptime2."
      command: "readAttribute"
      attribute: "UpTime"
      response:
          saveAs: uptime3
          constraints:
              hasValue: true
              type: int64u
              maxValue: uptime2 - 1

    - label: "Step 5a: Reboot target device"
      PICS: DGGEN.S.A0004 && PICS_SDK_CI_ONLY
      cluster: "SystemCommands"
      command: "Reboot"

    - label: "Step 5a: Reboot target device(DUT)"
      PICS: DGGEN.S.A0004 && PICS_USER_PROMPT
      verification: |
          Did the DUT successfully reboot?
      cluster: "LogCommands"
      command: "UserPrompt"
      arguments:
          values:
              - name: "message"
                value: "Please reboot the DUT and enter 'y' after DUT starts"
              - name: "expectedValue"
                value: "y"

    - label: "Wait for the commissioned device to be retrieved"
      PICS: DGGEN.S.A0004
      cluster: "DelayCommands"
      command: "WaitForCommissionee"
      arguments:
          values:
              - name: "nodeId"
                value: nodeId

    - label: "Step 5b: TH reads BootReason attribute value from DUT."
      PICS: DGGEN.S.A0004
      command: "readAttribute"
      attribute: "BootReason"
      response:
          constraints:
              hasValue: true
              type: enum8
              minValue: 0
              maxValue: 6

    - label: "Step 6a: TH subscribes to ActiveHardwareFaults attribute from DUT"
      PICS: DGGEN.S.A0005
      command: "subscribeAttribute"
      attribute: "ActiveHardwareFaults"
      minInterval: 10
      maxInterval: 1000
      response:
          constraints:
              hasValue: true
              type: list
              maxLength: 11
              python:
                  all(isinstance(fault, int) and not isinstance(fault, bool) and
                  0 <= fault <= 10 for fault in value)

    - label: "Step 6b: TH reads ActiveHardwareFaults attribute value from DUT."
      PICS: DGGEN.S.A0005
      command: "readAttribute"
      attribute: "ActiveHardwareFaults"
      response:
          constraints:
              hasValue: true
              type: list
              python:
                  all(isinstance(fault, int) and not isinstance(fault, bool) and
                  0 <= fault <= 10 for fault in value)
              minLength: 0
              maxLength: 11

    - label: "Step 7a: TH subscribes to ActiveRadioFaults attribute from DUT"
      PICS: DGGEN.S.A0006
      command: "subscribeAttribute"
      attribute: "ActiveRadioFaults"
      minInterval: 10
      maxInterval: 1000
      response:
          constraints:
              hasValue: true
              type: list
              maxLength: 7
              python:
                  all(isinstance(fault, int) and not isinstance(fault, bool) and
                  0 <= fault <= 6 for fault in value)

    - label: "Step 7b: TH reads ActiveRadioFaults attribute value from DUT."
      PICS: DGGEN.S.A0006
      command: "readAttribute"
      attribute: "ActiveRadioFaults"
      response:
          constraints:
              hasValue: true
              type: list
              python:
                  all(isinstance(fault, int) and not isinstance(fault, bool) and
                  0 <= fault <= 6 for fault in value)
              minLength: 0
              maxLength: 7

    - label: "Step 8a: TH subscribes to ActiveNetworkFaults attribute from DUT"
      PICS: DGGEN.S.A0007
      command: "subscribeAttribute"
      attribute: "ActiveNetworkFaults"
      minInterval: 100
      maxInterval: 1000
      response:
          constraints:
              hasValue: true
              type: list
              maxLength: 4
              python:
                  all(isinstance(fault, int) and not isinstance(fault, bool) and
                  0 <= fault <= 3 for fault in value)

    - label: "Step 8b: TH reads ActiveNetworkFaults attribute value from DUT."
      PICS: DGGEN.S.A0007
      command: "readAttribute"
      attribute: "ActiveNetworkFaults"
      response:
          constraints:
              hasValue: true
              type: list
              python:
                  all(isinstance(fault, int) and not isinstance(fault, bool) and
                  0 <= fault <= 3 for fault in value)
              minLength: 0
              maxLength: 4

    - label: "Step 9a: TH reads TestEventTriggersEnabled attribute value"
      PICS: DGGEN.S.A0008
      cluster: "General Diagnostics"
      command: "readAttribute"
      attribute: "TestEventTriggersEnabled"
      response:
          saveAs: TestEventTriggersEnabledValue
          constraints:
              hasValue: true
              type: boolean

    - label:
          "Step 9b: Verify TestEventTriggersEnabled attribute value is set to
          True"
      PICS: DGGEN.S.A0008
      cluster: "EqualityCommands"
      command: "BooleanEquals"
      arguments:
          values:
              - name: "Value1"
                value: true
              - name: "Value2"
                value: TestEventTriggersEnabledValue
      response:
          - values:
                - name: "Equals"
                  saveAs: IsExpectedValue

    - label:
          "Step 9c: When configured TRUE, Node has been configured with one or
          more test event triggers by virtue of the internally programmed non
          zero EnableKey value"
      runIf: IsExpectedValue
      PICS: DGGEN.S.C00.Rsp
      command: "TestEventTrigger"
      arguments:
          values:
              - name: "EnableKey"
                value: TEST_EVENT_ENABLE_KEY
              - name: "EventTrigger"
                value: TEST_EVENT_TRIGGER_KEY

    - label:
          "Step 10a: TH reads the TotalOperationalHours attribute from the DUT.
          Store the value in operational_hours1."
      PICS: DGGEN.S.A0003
      command: "readAttribute"
      attribute: "TotalOperationalHours"
      response:
          saveAs: operational_hours1
          constraints:
              hasValue: true
              type: int32u
              minValue: 0x0
              maxValue: 0xFFFFFFFF

    #Issue: https://github.com/project-chip/connectedhomeip/issues/29580
    - label: "Wait for 2 hours and 5 minutes."
      PICS: DGGEN.S.A0003
      cluster: "DelayCommands"
      command: "WaitForMs"
      arguments:
          values:
              - name: "ms"
                value: 7500000

    - label:
          "Step 10a: TH reads the TotalOperationalHours attribute from the DUT.
          Verify that operational_hours2 is greater than operational_hours1."
      PICS: DGGEN.S.A0003
      command: "readAttribute"
      attribute: "TotalOperationalHours"
      response:
          constraints:
              hasValue: true
              type: int32u
              minValue: operational_hours1 + 1
              maxValue: 0xFFFFFFFF

    - label: "Step 10b: Reset Devices to factory defaults"
      PICS: DGGEN.S.A0003 && PICS_SDK_CI_ONLY
      cluster: "SystemCommands"
      command: "FactoryReset"

    - label: "Step 10b: Reset Devices to factory defaults"
      PICS: DGGEN.S.A0003 && PICS_USER_PROMPT
      verification: |
          Reset Devices to factory defaults
      cluster: "LogCommands"
      command: "UserPrompt"
      arguments:
          values:
              - name: "message"
                value: "Factory Reset the DUT and enter 'y' after success"
              - name: "expectedValue"
                value: "y"

    - label: "Step 10b: TH starts a commissioning process with DUT"
      PICS: DGGEN.S.A0003
      cluster: "CommissionerCommands"
      command: "PairWithCode"
      arguments:
          values:
              - name: "nodeId"
                value: nodeId
              - name: "payload"
                value: payload

    - label: "Wait for the commissioned device to be retrieved"
      PICS: DGGEN.S.A0003
      cluster: "DelayCommands"
      command: "WaitForCommissionee"
      arguments:
          values:
              - name: "nodeId"
                value: nodeId

    - label:
          "Step 10b: TH reads the TotalOperationalHours attribute from the DUT.
          Verify that the value of 'TotalOperationalHours' is 0."
      PICS: DGGEN.S.A0003
      command: "readAttribute"
      attribute: "TotalOperationalHours"
      response:
          value: 0
          constraints:
              hasValue: true
              type: int32u

    #Issue: https://github.com/project-chip/connectedhomeip/issues/29580
    - label: "Wait for 1 hour 5 minutes."
      PICS: DGGEN.S.A0003
      cluster: "DelayCommands"
      command: "WaitForMs"
      arguments:
          values:
              - name: "ms"
                value: 3900000

    - label:
          "Step 10c: TH reads the TotalOperationalHours attribute from the DUT.
          Verify that the value of 'TotalOperationalHours' is 1."
      PICS: DGGEN.S.A0003
      command: "readAttribute"
      attribute: "TotalOperationalHours"
      response:
          value: 1
          constraints:
              hasValue: true
              type: int32u

    - label: "Step 10d: Reboot target device"
      PICS: DGGEN.S.A0003 && PICS_SDK_CI_ONLY
      cluster: "SystemCommands"
      command: "Reboot"

    - label: "Step 10d: Reboot target device(DUT)"
      PICS: DGGEN.S.A0003 && PICS_USER_PROMPT
      verification: |
          Did the DUT successfully reboot?
      cluster: "LogCommands"
      command: "UserPrompt"
      arguments:
          values:
              - name: "message"
                value: "Please reboot the DUT and enter 'y' after DUT starts"
              - name: "expectedValue"
                value: "y"

    - label: "Wait for the commissioned device to be retrieved"
      PICS: DGGEN.S.A0003
      cluster: "DelayCommands"
      command: "WaitForCommissionee"
      arguments:
          values:
              - name: "nodeId"
                value: nodeId

    - label:
          "Step 10d: TH reads the TotalOperationalHours attribute from the DUT.
          Verify that the value of 'TotalOperationalHours' is 1."
      PICS: DGGEN.S.A0003
      command: "readAttribute"
      attribute: "TotalOperationalHours"
      response:
          value: 1
          constraints:
              hasValue: true
              type: int32u
