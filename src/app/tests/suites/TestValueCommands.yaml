name: Test for assigning a literal value to a variable using ValueCommands

tests:
    - label: "Assign 1 to a variable"
      cluster: "ValueCommands"
      command: "UnsignedNumberValue"
      arguments:
          values:
              - name: "Value"
                value: 1
      response:
          - values:
                - name: "Value"
                  saveAs: AssignedOne

    - label:
          "Use the assigned value directly as a command argument, without
          needing an arithmetic expression to coerce its type"
      cluster: "EqualityCommands"
      command: "UnsignedNumberEquals"
      arguments:
          values:
              - name: "Value1"
                value: AssignedOne
              - name: "Value2"
                value: 1
      response:
          - values:
                - name: "Equals"
                  value: true

    - label: "Assign 0 to a variable"
      cluster: "ValueCommands"
      command: "UnsignedNumberValue"
      arguments:
          values:
              - name: "Value"
                value: 0
      response:
          - values:
                - name: "Value"
                  saveAs: AssignedZero

    - label:
          "Use the assigned value directly as a command argument, without
          needing an arithmetic expression to coerce its type. This also
          covers a falsy assigned value, unlike the previous step."
      cluster: "EqualityCommands"
      command: "UnsignedNumberEquals"
      arguments:
          values:
              - name: "Value1"
                value: AssignedZero
              - name: "Value2"
                value: 0
      response:
          - values:
                - name: "Equals"
                  value: true
