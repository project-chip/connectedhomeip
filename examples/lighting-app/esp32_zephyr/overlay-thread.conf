CONFIG_OPENTHREAD=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_SLAAC=y

# CHIP_WIFI selects WIFI and WIFI_ESP32, so this turns the Wi-Fi stack off entirely
CONFIG_CHIP_WIFI=n
CONFIG_NET_STATISTICS_WIFI=n

CONFIG_NET_IPV4=n
CONFIG_NET_DHCPV4=n

CONFIG_OPENTHREAD_THREAD_STACK_SIZE=6144

CONFIG_OPENTHREAD_THREAD_VERSION_1_3=y
CONFIG_OPENTHREAD_MLR=y
CONFIG_OPENTHREAD_DUA=y
CONFIG_OPENTHREAD_LINK_METRICS_INITIATOR=y
CONFIG_OPENTHREAD_LINK_METRICS_SUBJECT=y

CONFIG_NET_PKT_RX_COUNT=20
CONFIG_NET_PKT_TX_COUNT=20
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024

CONFIG_NET_IPV6_ND=n
CONFIG_NET_IPV6_NBR_CACHE=n
