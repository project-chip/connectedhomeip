# TL7218X Concurrent Mode with BLE Idle (Matter over Thread + BLE on demand)
# BLE idle mode: after commissioning, BLE stays idle (no advertising).
# Press button 2 to toggle BLE advertising on/off.
# Usage:
#   west build -p -b tl7218x -d build_tl7218x_concurrent_ble_idle -- \
#   -DCONF_FILE="prj.conf boards/tl7218x_concurrent.conf boards/tl7218x_concurrent_ble_idle.conf"

CONFIG_CHIP_CONCURRENT_BLE_IDLE=y
