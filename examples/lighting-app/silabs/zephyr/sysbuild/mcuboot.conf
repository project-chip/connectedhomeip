# Configuration overlay applied to the MCUboot bootloader image under sysbuild.
# Signature type and upgrade mode are set via SB_CONFIG_* (see Kconfig.sysbuild).

CONFIG_BOOT_BUILTIN_KEY=n

# Keep MCUboot within the 48 KiB boot partition with both GCC and Clang.
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
