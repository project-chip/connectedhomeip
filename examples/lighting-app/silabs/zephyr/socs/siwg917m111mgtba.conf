CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=1024

# Expose Wi-Fi Network Commissioning attributes (ConnectMaxTimeSeconds, etc.)
CONFIG_CHIP_ENABLE_WIFI_STATION=y

# Native Wi-Fi needs Ethernet-sized buffers. Keep headroom for
# Matter CASE / mDNS bursts after commissioning.
CONFIG_NET_BUF_DATA_SIZE=1514
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24

# Required for IPV6_RECVPKTINFO / correct UDP reply addressing
CONFIG_NET_CONTEXT_RECV_PKTINFO=y

# Matter mDNS / group messaging
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=14
