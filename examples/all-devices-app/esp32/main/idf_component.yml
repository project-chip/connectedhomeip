## IDF component manager dependencies.
##
## Each board support package is only meaningful on the SoC of its board, so the
## rules keep it out of the other boards' dependency graphs.
dependencies:
    espressif/m5stack_core_s3:
        version: "^4.1"
        rules:
            - if: "target == esp32s3"

    ## The Mosaico's USB-C port is the USB OTG controller: a CDC device carries the console.
    espressif/esp_tinyusb:
        version: "^3.0.0-rc2"
        rules:
            - if: "target == esp32s31"
