# west build -b <board> examples/all-devices-app/zephyr -- -DFILE_SUFFIX=debug

CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="CHIPProjectConfig.h"

# Thread introspection: names threads and lists them via the "kernel threads"
# shell command.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# Zero-fills thread stacks at creation and checks a canary word on each
# context switch, so stack overflows/high-water-marks can be diagnosed.
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y

# OpenThread CLI ("ot ...") commands on top of the Matter shell.
CONFIG_OPENTHREAD_SHELL=y

# Verbose application + Matter stack logging.
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_CHIP_APP_LOG_LEVEL=4
CONFIG_LOG_INFO_COLOR_GREEN=y
CONFIG_LOG_DBG_COLOR_BLUE=y

# OTA Requestor
CONFIG_CHIP_OTA_REQUESTOR=y
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y
CONFIG_IMG_MANAGER=y

# Full __ASSERT() checking (adds spinlock validation and per-assert file info).
CONFIG_ASSERT=y


CONFIG_SHELL=n
CONFIG_CHIP_LIB_SHELL=n

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_PRINTK_SYNC=n
CONFIG_BOOT_BANNER=y