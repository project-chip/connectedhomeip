# Pre-existing NVS tuning. This is not required to enable Wi-Fi; keep it while
# validating the all-devices data model, then re-evaluate against the final
# persistent-storage usage.
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=1024

# Si917 Wi-Fi / Matter-over-Wi-Fi integration.  Keep these explicit instead of
# relying solely on the generic defaults in Kconfig.defaults: CONFIG_WIFI makes
# CHIP_WIFI available, and the latter two select the Matter Wi-Fi root feature
# (Network Commissioning + Wi-Fi Network Diagnostics) and station driver.
CONFIG_WIFI=y
CONFIG_CHIP_WIFI=y
CONFIG_CHIP_ENABLE_WIFI_STATION=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1

# Pre-existing board support. The siwx917 board defconfigs do not enable GPIO;
# Buttons.cpp (sw0) and LED-based sample devices need the ULP GPIO controllers.
# It is unrelated to Wi-Fi and can be removed only if those app features are
# removed as well.
CONFIG_GPIO=y

CONFIG_MBEDTLS_ECP_NIST_OPTIM=y

CONFIG_SETTINGS_NVS_SECTOR_COUNT=6
