CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=1024

CONFIG_WIFI=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1

# The siwx917 board defconfigs do not enable GPIO. Buttons.cpp (sw0) and the
# LED devices (led0) need the ULP GPIO controllers compiled in.
CONFIG_GPIO=y
