# ESP32-C6: Matter over Wi-Fi by default, overlay-thread.conf selects Thread.
# Values follow examples/lighting-app/esp32_zephyr.

# Matter over Wi-Fi with the ESP32-native driver (no WPA supplicant)
CONFIG_NET_L2_OPENTHREAD=n
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
# The esp32 driver only registers with the Wi-Fi network manager in AP+STA mode
CONFIG_WIFI_NM=n

# Wi-Fi statistics used by the Matter diagnostics clusters
CONFIG_NET_STATISTICS_WIFI=y

CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=14

# Network buffers, trimmed for the C6 SRAM
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_BUF_DATA_SIZE=128

# BLE host
CONFIG_BT_RX_STACK_SIZE=4096
# BLE controller: one peripheral connection plus advertising is enough
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=1
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=2

# Crypto: PSA backend; key pairs are imported from storage and exported for it
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y

# Persistent storage
CONFIG_NVS_LOOKUP_CACHE=y

# Stack protection (no PMP stack guard on the C6) and stack high-water marks
CONFIG_HW_STACK_PROTECTION=n
CONFIG_STACK_CANARIES=y
CONFIG_INIT_STACKS=y

# Logging
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_THREAD_NAME=y

# No shell in the default profile; prj_debug.conf enables it
CONFIG_SHELL=n
CONFIG_CHIP_LIB_SHELL=n

CONFIG_MAX_EVENT_QUEUE_SIZE=16
