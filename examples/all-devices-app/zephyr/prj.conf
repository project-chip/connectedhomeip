CONFIG_CHIP=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CHIP_PROJECT_CONFIG="CHIPProjectConfig.h"
CONFIG_OPENTHREAD_SHELL=n

CONFIG_BUILD_OUTPUT_HEX=y

# Pre-existing logging allocation; not required for Wi-Fi. Retain for
# commissioning diagnostics and re-evaluate for the release footprint.
CONFIG_LOG_BUFFER_SIZE=8192


# Pre-existing resource tuning. Retain during Wi-Fi commissioning validation;
# profile these values after the all-device endpoint set is finalized.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=8192

# Pre-existing network/storage sizing. The Si917 Wi-Fi settings are kept in
# socs/siwg917m111mgtba.conf; retain these generic values until comparison with
# the known-working lighting-app final .config is complete.
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_SETTINGS_NVS_SECTOR_COUNT=6
