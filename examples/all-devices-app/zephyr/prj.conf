CONFIG_CHIP=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CHIP_PROJECT_CONFIG="CHIPProjectConfig.h"
CONFIG_OPENTHREAD_SHELL=n

# Application requirements. Set here (not as Kconfig defaults) so they are not
# overridden by the shared Matter/vendor defaults sourced in Kconfig.defaults.
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_MBEDTLS_HEAP_SIZE=8192

# OTA Requestor is disabled by default; see prj_debug.conf / prj_release.conf.
CONFIG_CHIP_OTA_REQUESTOR=n

CONFIG_BUILD_OUTPUT_HEX=y
