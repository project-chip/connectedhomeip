# MCUboot and Matter OTA are deliberately disabled on this board. The board has
# no second flash area, and the application uses the complete available image
# region instead.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_OTA_IMAGE_BUILD=n
CONFIG_STREAM_FLASH=n
CONFIG_STREAM_FLASH_ERASE=n
CONFIG_IMG_MANAGER=n
CONFIG_MCUBOOT_IMG_MANAGER=n
CONFIG_MCUBOOT_BOOTUTIL_LIB=n
