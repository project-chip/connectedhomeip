# west build -b <board> examples/all-devices-app/zephyr -- -DFILE_SUFFIX=release

CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="CHIPProjectConfig.h"

CONFIG_USE_SEGGER_RTT=n

# No shell (Matter or OT) in a release build.
CONFIG_SHELL=n
CONFIG_CHIP_LIB_SHELL=n

# No console/log output path at all.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_PRINTK_SYNC=n
CONFIG_BOOT_BANNER=n

# OTA
CONFIG_CHIP_OTA_REQUESTOR=y
CONFIG_CHIP_OTA_IMAGE_BUILD=y
CONFIG_CHIP_DEVICE_SOFTWARE_VERSION=1
CONFIG_CHIP_DEVICE_SOFTWARE_VERSION_STRING="1.0"
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.0+0"
