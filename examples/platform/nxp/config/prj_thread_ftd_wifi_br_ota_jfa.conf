# Thread Border Router + Wi-Fi + OTA configuration with the Joint Fabric
# Administrator (JFA) role enabled. This builds on the standard BR configuration
# and additionally pulls in the JointFabric clusters and Pigweed RPC service.

# CHIP configs
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_CHIP_OPENTHREAD_FTD=y
CONFIG_CHIP_WIFI=y
CONFIG_CHIP_SECONDARY_NETWORK_IF=y
CONFIG_CHIP_THREAD_NETWORK_ENDPOINT_ID=2

# OTA Requestor configs
CONFIG_CHIP_OTA_REQUESTOR=y

# Pigweed RPC server (HDLC over TCP / lwIP)
CONFIG_CHIP_APP_RPC=y

# Joint Fabric Administrator (adds controller/commissioner role)
CONFIG_CHIP_APP_JF_ADMIN=y
