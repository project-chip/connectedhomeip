# TL3238X Retention Concurrent Mode (Matter over Thread + BLE coexistence)
# This config enables BLE + 802.15.4 coexistence mode.
# Usage:
#   west build -p -b tl3238x_retention -d build_tl3238x_retention_concurrent -- \
#   -DCONF_FILE="prj.conf boards/tl3238x_retention_concurrent.conf" > build_tl3238x_retention_concurrent.log

# Enable concurrent mode (Matter over Thread + BLE)
CONFIG_CHIP_CONCURRENT_MODE=y
CONFIG_IEEE802154_TLX_BLE_COEXIST=y

# CONFIG_CHIP_DEVICE_SERIAL_NUMBER="TelinkLightSwitch-tl3238c"

# Disable Matter OTA DFU
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_DFU_OVER_BT_SMP=n
CONFIG_CHIP_DFU_OVER_BT_SMP_BUILD=n

# LZMA compression library support
# Keep LZMA library enabled for potential general compression needs
CONFIG_LZMA=n
# Disable Telink-specific LZMA firmware decompression for bootloader
CONFIG_COMPRESS_LZMA=n

# Enable ADC
CONFIG_ADC=y

#matter switch mode
# config NORMAL_MODE    0 independent matter mode
# ACTION_DUAL_MODE      1 matter action switch mode ,such as by button
# AUTO_SWITCH_DUAL_MODE 2 matter auto-switch mode ,such as by scan QR code.
CONFIG_DUAL_MODE=0
