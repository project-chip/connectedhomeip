# Disable BLE after Matter commissioning, but allow on-demand resume:
# a button press re-enables BLE advertising while the device stays on Thread.
CONFIG_CHIP_CONCURRENT_BLE_OFF_AFTER_COMMISSIONING=y
CONFIG_CHIP_CONCURRENT_BLE_RESUME_AFTER_COMMISSIONING=y

# Use the public BLE MAC (matches the ot_ble_pm sample). The controller reports
# it via READ_BD_ADDR and the Zephyr host creates the identity automatically in
# bt_id_init(); no explicit bt_id_create()/InitBLEMACAddress() is required.
CONFIG_TL_BLE_CTRL_MAC_TYPE_PUBLIC=y
