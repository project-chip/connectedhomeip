# TL7218X Retention Concurrent Mode (Matter over Thread + BLE coexistence)
# This config enables BLE + 802.15.4 coexistence mode.
# Usage:
#   west build -p -b tl7218x_retention -d build_tl7218x_retention_concurrent -- \
#   -DCONF_FILE="prj.conf boards/tl7218x_retention_concurrent.conf" > build_tl7218x_retention_concurrent.log

# Enable concurrent mode (Matter over Thread + BLE)
CONFIG_CHIP_CONCURRENT_MODE=y
CONFIG_IEEE802154_TLX_BLE_COEXIST=y

# Concurrent mode runs BLE callbacks and the post-commissioning BLE teardown
# work on the system workqueue; the PM default (664) is too small and overflows.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
