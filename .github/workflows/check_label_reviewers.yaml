name: Check SME Label Reviewers

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created]
  push:
    branches: [master]
    paths:
      - ".github/label_reviewers.yaml"
  workflow_dispatch:

jobs:
  check-sme-review:
    name: Check SME Approvals
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/check-sme'))
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir pyyaml

      - name: Determine PR Number and Options
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ]; then
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "sync_labels=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            echo "pr_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "sync_labels=false" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "sync_labels=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests
        run: |
          python3 -m unittest scripts/tools/tests/test_check_label_reviewers.py

      - name: Validate Base Configuration File
        run: |
          python3 scripts/tools/check_label_reviewers.py \
            --config .github/label_reviewers.yaml \
            --validate-config

      - name: Validate Pull Request Configuration File
        if: steps.params.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.params.outputs.pr_number }}
        run: |
          git fetch origin "refs/pull/${PR_NUMBER}/head" --depth=1
          if git cat-file -e FETCH_HEAD:.github/label_reviewers.yaml 2>/dev/null; then
            git show FETCH_HEAD:.github/label_reviewers.yaml > /tmp/pr_label_reviewers.yaml
            python3 scripts/tools/check_label_reviewers.py \
              --config /tmp/pr_label_reviewers.yaml \
              --validate-config
          fi

      - name: Execute SME Reviewer Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_LABELS: ${{ steps.params.outputs.sync_labels }}
          PR_NUMBER: ${{ steps.params.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$SYNC_LABELS" = "true" ]; then
            python3 scripts/tools/check_label_reviewers.py \
              --repo "$REPO" \
              --config .github/label_reviewers.yaml \
              --sync-labels
          fi

          if [ -n "$PR_NUMBER" ]; then
            python3 scripts/tools/check_label_reviewers.py \
              --pr "$PR_NUMBER" \
              --repo "$REPO" \
              --config .github/label_reviewers.yaml
          fi
