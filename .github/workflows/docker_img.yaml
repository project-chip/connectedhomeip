name: Docker CHIP images

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
    cancel-in-progress: true

on:
    workflow_call:
        inputs:
          push_images:
            required: false
            type: boolean
            default: false
    push:
        paths:
            - "integrations/docker/**"
            # Changing which images this workflow builds should build them.
            - ".github/workflows/docker_img.yaml"
    pull_request:
        paths:
            - "integrations/docker/**"
            - ".github/workflows/docker_img.yaml"
    workflow_dispatch:
        inputs:
            push_images:
              required: false
              type: boolean
              default: false

jobs:
    build_images_base:
        name: Build Docker CHIP Build images - base
        runs-on: namespace-profile-4x16
        if: github.actor != 'restyled-io[bot]'
        permissions:
            contents: read
            packages: write
        env:
            # Publish on an explicit dispatch, or automatically once a change to
            # integrations/docker/ has landed on master. Pull requests and pushes
            # to other branches build only.
            PUBLISH: ${{ inputs.push_images == true || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        strategy:
            fail-fast: false
            matrix:
                img:
                    - ""
                    - "-minimal"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Log in to ghcr.io
              if: env.PUBLISH == 'true'
              env:
                  GHCR_TOKEN: ${{ github.token }}
              run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            - name: Build & Push images using project bash script
              if: env.PUBLISH == 'true'
              run: |
                  cd integrations/docker/images/base/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: env.PUBLISH != 'true'
              run: |
                  cd integrations/docker/images/base/chip-build${{ matrix.img }}
                  ./build.sh --latest

            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}

    # Build-only, on a native arm64 runner. This verifies the base image still
    # builds for linux/arm64; it deliberately does not tag or push, because how a
    # multi-arch image should be published is a separate decision.
    build_images_base_arm64:
        name: Build Docker CHIP Build images - base (arm64)
        runs-on: ubuntu-24.04-arm
        if: github.actor != 'restyled-io[bot]'
        # Build-only, so no packages: write here, unlike the amd64 job above.
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                img:
                    - ""
                    - "-minimal"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Build images using project bash script
              run: |
                  cd integrations/docker/images/base/chip-build${{ matrix.img }}
                  ./build.sh

            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
    # These jobs run on namespace runners rather than GitHub-hosted ones. A
    # GitHub-hosted runner guarantees only 14GB of free space and frequently
    # provides more, so an image needing more than that does not fail cleanly,
    # it fails depending on which runner it draws. Two images measured above
    # that line: efr32 at 17.8GB and nxp at 14.6GB. A namespace shape gives a
    # fixed disk size instead, which turns that class of flake into a property
    # we can size for.
    #
    # Per-image peaks were measured with one build per runner, since each job
    # here builds a single image; the figure that matters is that peak, not the
    # total a sequential run would accumulate.
    #
    # See https://github.com/project-chip/connectedhomeip/issues/30750
    build_images_stage_1:
        needs: [build_images_base]
        name: Build Docker CHIP Build images - stage 1
        runs-on: namespace-profile-4x16
        if: github.actor != 'restyled-io[bot]'
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                img:
                    - "-crosscompile"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Log in to ghcr.io
              if: ${{ inputs.push_images == true }}
              env:
                  GHCR_TOKEN: ${{ github.token }}
              run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            - name: Build & Push images using project bash script
              if: ${{ inputs.push_images == true }}
              run: |
                  cd integrations/docker/images/stage-1/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: ${{ inputs.push_images == false }}
              run: |
                  cd integrations/docker/images/stage-1/chip-build${{ matrix.img }}
                  ./build.sh --latest
            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
    build_images_stage_2:
        needs: [build_images_base, build_images_stage_1]
        name: Build Docker CHIP Build images - stage 2
        runs-on: namespace-profile-4x16
        if: github.actor != 'restyled-io[bot]'
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                img:
                    - "-ameba"
                    - "-asr"
                    - "-bouffalolab"
                    - "-doxygen"
                    # The two largest: 17.8GB and 14.6GB peak. Both exceed what a
                    # GitHub-hosted runner guarantees, which is why these jobs
                    # run on a namespace shape.
                    - "-efr32"
                    - "-esp32"
                    - "-infineon"
                    # imx was disabled for "no space left on device". Built alone
                    # it peaks at 8.9GB, so the original failure came from sharing
                    # a runner rather than from the image.
                    - "-imx"
                    - "-java"
                    - "-nxp"
                    - "-nxp-zephyr"
                    - "-nrf-platform"
                    - "-realtek-zephyr"
                    - "-silabs-zephyr"
                    - "-telink"
                    - "-telink-zephyr_3_3"
                    - "-ti"
                    - "-tizen"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Log in to ghcr.io
              if: ${{ inputs.push_images == true }}
              env:
                  GHCR_TOKEN: ${{ github.token }}
              run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            - name: Build & Push images using project bash script
              if: ${{ inputs.push_images == true }}
              run: |
                  cd integrations/docker/images/stage-2/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: ${{ inputs.push_images == false }}
              run: |
                  cd integrations/docker/images/stage-2/chip-build${{ matrix.img }}
                  ./build.sh --latest

            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
    build_images_stage_3:
        needs: [build_images_base, build_images_stage_1, build_images_stage_2]
        name: Build Docker CHIP Build images - stage 3
        runs-on: namespace-profile-4x16
        if: github.actor != 'restyled-io[bot]'
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                img:
                    - "-android"
                    - "-esp32-qemu"
                    - "-tizen-qemu"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Log in to ghcr.io
              if: ${{ inputs.push_images == true }}
              env:
                  GHCR_TOKEN: ${{ github.token }}
              run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            - name: Build & Push images using project bash script
              if: ${{ inputs.push_images == true }}
              run: |
                  cd integrations/docker/images/stage-3/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: ${{ inputs.push_images == false }}
              run: |
                  cd integrations/docker/images/stage-3/chip-build${{ matrix.img }}
                  ./build.sh --latest
            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
    # NOTE: vscode stays disabled. It is an aggregator, with 28 COPY --from=
    #       lines pulling toolchains out of 17 other images, and those bytes are
    #       duplicated rather than shared. On a dedicated runner with 88GB free
    #       and nothing else on it, the build did not fail: it killed the runner
    #       outright after ~12 minutes, leaving no logs to diagnose. Nothing
    #       depends on this image, so it does not block anything else.
    build_images_vscode:
        needs: [build_images_base, build_images_stage_1, build_images_stage_2, build_images_stage_3]
        name: Build Docker CHIP Build images - vscode
        runs-on: namespace-profile-4x16
        if: github.actor != 'restyled-io[bot]' && false
        strategy:
            fail-fast: false
            matrix:
                img:
                    - "-vscode"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Log in to ghcr.io
              if: ${{ inputs.push_images == true }}
              env:
                  GHCR_TOKEN: ${{ github.token }}
              run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            - name: Build & Push images using project bash script
              if: ${{ inputs.push_images == true }}
              run: |
                  cd integrations/docker/images/vscode/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: ${{ inputs.push_images == false }}
              run: |
                  cd integrations/docker/images/vscode/chip-build${{ matrix.img }}
                  ./build.sh --latest
            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
