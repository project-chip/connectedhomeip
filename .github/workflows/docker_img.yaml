name: Docker CHIP images

on:
    workflow_call:
        inputs:
          push_images:
            required: false
            type: boolean
            default: false
    push:
        paths:
            - "integrations/docker/**"
    pull_request:
        paths:
            - "integrations/docker/**"
    workflow_dispatch:
        inputs:
            push_images:
              required: false
              type: boolean
              default: false

jobs:
    build_images_base:
        name: Build Docker CHIP Build images - base
        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'
        permissions:
            contents: read
            packages: write
        env:
            # Publish on an explicit dispatch, or automatically once a change to
            # integrations/docker/ has landed on master. Pull requests and pushes
            # to other branches build only.
            PUBLISH: ${{ inputs.push_images == true || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        strategy:
            fail-fast: false
            matrix:
                img:
                    - ""
                    - "-minimal"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Log in to ghcr.io
              if: env.PUBLISH == 'true'
              env:
                  GHCR_TOKEN: ${{ github.token }}
              run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            - name: Build & Push images using project bash script
              if: env.PUBLISH == 'true'
              run: |
                  cd integrations/docker/images/base/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: env.PUBLISH != 'true'
              run: |
                  cd integrations/docker/images/base/chip-build${{ matrix.img }}
                  ./build.sh --latest

            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
    # Every image below is built on its own runner, so the figure that matters is
    # the peak a single image reaches, not the total of a sequential run. GitHub
    # guarantees 14GB of free space; runners frequently provide more, so anything
    # above the guarantee is a flake waiting to happen rather than a clean failure.
    #
    # Images measured above that line are commented out individually with what
    # they actually cost, in the same style as the entries that were already
    # disabled here. Measurements are from a per-image probe on ubuntu-latest.
    #
    # See https://github.com/project-chip/connectedhomeip/issues/30750
    build_images_stage_1:
        needs: [build_images_base]
        name: Build Docker CHIP Build images - stage 1
        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                img:
                    - "-crosscompile"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Build & Push images using project bash script
              if: ${{ inputs.push_images == true }}
              run: |
                  cd integrations/docker/images/stage-1/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: ${{ inputs.push_images == false }}
              run: |
                  cd integrations/docker/images/stage-1/chip-build${{ matrix.img }}
                  ./build.sh --latest
            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
    build_images_stage_2:
        needs: [build_images_base, build_images_stage_1]
        name: Build Docker CHIP Build images - stage 2
        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                img:
                    - "-ameba"
                    - "-asr"
                    - "-bouffalolab"
                    - "-doxygen"
                    # NOTE: efr32 peaks at 17.8GB, well past the 14GB GitHub
                    # guarantees. It succeeds only on runners that happen to
                    # offer more, so enabling it buys intermittent failures.
                    # - "-efr32"
                    - "-esp32"
                    - "-infineon"
                    # imx was disabled for "no space left on device". Measured on
                    # its own runner it peaks at 8.9GB, comfortably inside the
                    # guarantee; the old failure was a shared-runner artifact.
                    - "-imx"
                    - "-java"
                    # NOTE: nxp peaks at 14.6GB, just past the 14GB guarantee.
                    # - "-nxp"
                    - "-nxp-zephyr"
                    - "-nrf-platform"
                    - "-realtek-zephyr"
                    # silabs-zephyr (12.3GB) and telink (14.1GB) are inside the
                    # guarantee but with little room. If either starts failing
                    # intermittently, disk is the first thing to check.
                    - "-silabs-zephyr"
                    - "-telink"
                    - "-telink-zephyr_3_3"
                    - "-ti"
                    - "-tizen"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Build & Push images using project bash script
              if: ${{ inputs.push_images == true }}
              run: |
                  cd integrations/docker/images/stage-2/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: ${{ inputs.push_images == false }}
              run: |
                  cd integrations/docker/images/stage-2/chip-build${{ matrix.img }}
                  ./build.sh --latest

            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
    build_images_stage_3:
        needs: [build_images_base, build_images_stage_1, build_images_stage_2]
        name: Build Docker CHIP Build images - stage 3
        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                img:
                    - "-android"
                    - "-esp32-qemu"
                    - "-tizen-qemu"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Build & Push images using project bash script
              if: ${{ inputs.push_images == true }}
              run: |
                  cd integrations/docker/images/stage-3/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: ${{ inputs.push_images == false }}
              run: |
                  cd integrations/docker/images/stage-3/chip-build${{ matrix.img }}
                  ./build.sh --latest
            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
    # NOTE: vscode stays disabled. It is an aggregator, with 28 COPY --from=
    #       lines pulling toolchains out of 17 other images, and those bytes are
    #       duplicated rather than shared. On a dedicated runner with 88GB free
    #       and nothing else on it, the build did not fail: it killed the runner
    #       outright after ~12 minutes, leaving no logs to diagnose. Nothing
    #       depends on this image, so it does not block anything else.
    build_images_vscode:
        needs: [build_images_base, build_images_stage_1, build_images_stage_2, build_images_stage_3]
        name: Build Docker CHIP Build images - vscode
        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]' && false
        strategy:
            fail-fast: false
            matrix:
                img:
                    - "-vscode"
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Build & Push images using project bash script
              if: ${{ inputs.push_images == true }}
              run: |
                  cd integrations/docker/images/vscode/chip-build${{ matrix.img }}
                  ./build.sh --latest --push
            - name: Build images using project bash script
              if: ${{ inputs.push_images == false }}
              run: |
                  cd integrations/docker/images/vscode/chip-build${{ matrix.img }}
                  ./build.sh --latest
            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
