name: Build Certification Image v2
on:
  workflow_call:
  workflow_dispatch:

jobs:
  load-targets-as-output:
    runs-on: ubuntu-24.04-arm
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            integrations/docker/images/chip-cert-bins/targets.json
          sparse-checkout-cone-mode: false
      - name: Set targets
        id: set-targets
        run: |
          targets=$(cat integrations/docker/images/chip-cert-bins/targets.json | tr -d '\n' | tr -d ' ')
          echo "targets=$targets" >> $GITHUB_OUTPUT

  build-target:
    needs: [load-targets-as-output]
    strategy:
      matrix:
        target: ${{ fromJSON(needs.load-targets-as-output.outputs.targets) }}
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/project-chip/chip-build:219
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Checkout submodules & Bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: linux
      - run: |
          mkdir -p stripped-bins
      - run: |
          sed -i 's/treat_warnings_as_errors = true/treat_warnings_as_errors = false/' build/config/compiler/BUILD.gn
      - name: Setup and Restore Cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          # cache anrtifact is generated by all-clusters-app, as that has the most overlap
          build-variant: linux-arm64-release-size
      - name: build target
        run: |
          ./scripts/run_in_build_env.sh \
              "./scripts/build/build_examples.py \
                --build-profile=release-size \
                --target linux-arm64-${{ matrix.target }} \
                --pw-command-launcher=ccache \
                build \
              "
      - name: strip and move binary
        run: |
          find out/linux-arm64-${{ matrix.target }}-release-size -maxdepth 1 -type f -executable -exec mv {} stripped-bins/ \;
          find stripped-bins -type f -executable -exec strip --strip-all {} \;
      # The OTA payload must be built as software version 2 to match the image
      # header (-vn), or the requestor fails ConfirmCurrentImage() after
      # re-executing it. chip-ota-requestor-app itself stays version 1.
      - name: Generate OTA image
        if: startsWith(matrix.target, 'ota-requestor')
        shell: bash
        run: |
              set -euxo pipefail
              sed -i \
                -e 's/\(CHIP_DEVICE_CONFIG_DEVICE_SOFTWARE_VERSION\) 1$/\1 2/' \
                -e 's/\(CHIP_DEVICE_CONFIG_DEVICE_SOFTWARE_VERSION_STRING\) "1.0"$/\1 "2.0"/' \
                config/standalone/CHIPProjectConfig.h
              grep -q 'CHIP_DEVICE_CONFIG_DEVICE_SOFTWARE_VERSION 2$' config/standalone/CHIPProjectConfig.h
              grep -q 'CHIP_DEVICE_CONFIG_DEVICE_SOFTWARE_VERSION_STRING "2.0"$' config/standalone/CHIPProjectConfig.h
              ./scripts/run_in_build_env.sh \
                  "./scripts/build/build_examples.py \
                    --build-profile=release-size \
                    --target linux-arm64-${{ matrix.target }} \
                    --out-prefix /tmp/ota-requestor-v2 \
                    --pw-command-launcher=ccache \
                    build \
                  "
              git checkout -- config/standalone/CHIPProjectConfig.h
              v2_app=/tmp/ota-requestor-v2/linux-arm64-${{ matrix.target }}-release-size/chip-ota-requestor-app
              strip --strip-all "$v2_app"
              if cmp -s "$v2_app" stripped-bins/chip-ota-requestor-app; then
                echo "::error::The version 2 OTA requestor is identical to the version 1 build"
                exit 1
              fi
              ./src/app/ota_image_tool.py create \
                -v 0xDEAD \
                -p 0xBEEF \
                -vn 2 \
                -vs "2.0" \
                -da sha256 \
                "$v2_app" \
                stripped-bins/ota-requestor-app.ota
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-${{ matrix.target }}
          path: stripped-bins
      - name: Ensure only useful ccache is kept
        if: github.ref == 'refs/heads/master' && matrix.target == 'all-clusters-ipv6only'
        run: ccache --evict-older-than 1d || true
      - name: Delete existing ccache before save
        if: github.ref == 'refs/heads/master' && matrix.target == 'all-clusters-ipv6only'
        uses: ./.github/actions/delete-cache
        with:
          cache-key: ${{ env.CCACHE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Save ccache
        if: github.ref == 'refs/heads/master' && matrix.target == 'all-clusters-ipv6only'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ${{ env.CCACHE_KEY }}

  # Extra copies of the apps used by the PQC certification tests, statically
  # linked against the image's private OpenSSL 3.5 and published as
  # openssl3_5-<app>. The regular builds use the system OpenSSL
  # 3.0, which lacks ML-DSA. Remove once Ubuntu's system OpenSSL is 3.5.
  build-openssl-3-5-target:
    strategy:
      matrix:
        include:
          - target: all-devices-ipv6only
            app: all-devices-app
          - target: network-manager-ipv6only
            app: matter-network-manager-app
          - target: chip-tool-ipv6only-platform-mdns-nfc-commission
            app: chip-tool
          - target: all-clusters-ipv6only
            app: chip-all-clusters-app
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/project-chip/chip-build:219
    env:
      CHIP_OPENSSL_ROOT: /opt/matter/openssl
      CHIP_OPENSSL_STATIC: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Checkout submodules & Bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: linux
      - run: |
          sed -i 's/treat_warnings_as_errors = true/treat_warnings_as_errors = false/' build/config/compiler/BUILD.gn
      - name: Setup and Restore Cache
        uses: ./.github/actions/setup-ccache
        with:
          build-variant: linux-arm64-release-size
      - name: build target
        run: |
          ./scripts/run_in_build_env.sh \
              "./scripts/build/build_examples.py \
                --build-profile=release-size \
                --target linux-arm64-${{ matrix.target }} \
                --pw-command-launcher=ccache \
                build \
              "
      # No dynamic libssl/libcrypto dependency, plus ML-DSA code that only
      # exists in OpenSSL 3.5, shows the app carries the static OpenSSL 3.5.
      - name: Check OpenSSL 3.5 linkage, strip and rename
        shell: bash
        run: |
          set -euxo pipefail
          app=out/linux-arm64-${{ matrix.target }}-release-size/${{ matrix.app }}
          if readelf -d "$app" | grep -E 'NEEDED.*lib(ssl|crypto)\.so'; then
            echo "::error::$app links OpenSSL dynamically"
            exit 1
          fi
          if ! nm "$app" | grep ossl_ml_dsa >/dev/null; then
            echo "::error::$app does not contain OpenSSL 3.5 ML-DSA code"
            exit 1
          fi
          mkdir -p stripped-bins
          strip --strip-all "$app" -o stripped-bins/openssl3_5-${{ matrix.app }}
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-openssl3_5-${{ matrix.target }}
          path: stripped-bins

  build-python:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/project-chip/chip-build:219
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Checkout submodules & Bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: linux
      - name: Setup and Restore Cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          build-variant: python
      - name: Build Python components
        shell: bash
        run: |
              source scripts/activate.sh
              scripts/build_python.sh \
                -m platform \
                -d true \
                --enable_nfc true \
                --enable-ccache
      - name: Move files and install dependencies
        run: |
          mkdir -p python_testing/scripts/sdk
          mkdir -p python_testing/data_model
          mkdir -p apps/push_av_server
          mkdir mock_server
          cp -r src/python_testing/* python_testing/scripts/sdk
          cp -r data_model/* python_testing/data_model
          cp -r src/tools/push_av_server/* apps/push_av_server
          cp -r integrations/mock_server mock_server
          pip install --break-system-packages -r python_testing/scripts/sdk/requirements.txt \
              && rm python_testing/scripts/sdk/requirements.txt
          pip install --break-system-packages -r apps/push_av_server/requirements.txt \
              && patch -d $(python3 -c "from importlib.metadata import distribution; print(distribution('hypercorn').locate_file(''))") -p0 < apps/push_av_server/hypercorn.patch
          pip install --break-system-packages -r python_testing/scripts/sdk/requirements.nfc.txt \
              && rm python_testing/scripts/sdk/requirements.nfc.txt
      - name: Build Python wheels
        shell: bash
        working-directory: ./out
        run: |
          pip install --break-system-packages --no-cache-dir \
            ./python_lib/python/obj/scripts/py_matter_idl/matter-idl._build_wheel/matter_idl-*.whl \
            ./python_lib/python/obj/scripts/py_matter_yamltests/matter-yamltests._build_wheel/matter_yamltests-*.whl \
            ./python_lib/obj/src/python_testing/matter_testing_infrastructure/matter-testing._build_wheel/matter_testing-*.whl \
            ./python_lib/obj/src/controller/python/matter-controller-wheels/*.whl
      - name: Save OpenSSL 3.5 shared libraries
        run: |
          mkdir -p openssl-lib
          cp -P /opt/matter/openssl/lib/libssl.so* /opt/matter/openssl/lib/libcrypto.so* openssl-lib/
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openssl-lib-arm64
          path: openssl-lib
      - name: Save python dist-packages directory
        id: dist-packages
        run: |
          dist_packages=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "dist_packages=$dist_packages" >> $GITHUB_OUTPUT
      - name: Save usr/local/bin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: user-local-bin-arm64
          path: /usr/local/bin
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-linux-arm64
          path: ${{ steps.dist-packages.outputs.dist_packages }}
      - name: Ensure only useful ccache is kept
        if: github.ref == 'refs/heads/master'
        run: ccache --evict-older-than 1d || true
      - name: Delete existing ccache before save
        if: github.ref == 'refs/heads/master'
        uses: ./.github/actions/delete-cache
        with:
          cache-key: ${{ env.CCACHE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Save ccache
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ${{ env.CCACHE_KEY }}

  create-image:
    needs: [build-target, build-openssl-3-5-target, build-python]
    runs-on: ubuntu-24.04-arm
    permissions:
        contents: read
    steps:
      - name: Checkout just the files we need to copy to the image
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            integrations/docker/images/chip-cert-bins/Dockerfile-ci
            examples/fabric-admin/scripts/fabric-sync-app.py
            src/tools/push_av_server
            src/python_testing
            data_model
            integrations/mock_server
            credentials/test/revoked-attestation-certificates/dac-provider-test-vectors
            credentials/test/revoked-attestation-certificates/revocation-sets
      - name: Download example artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
          path: apps/
          pattern: linux-arm64-*
      - name: Download python artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist-packages/
          name: python-linux-arm64
      - name: Download usr/local/bin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: usr-local-bin/
          name: user-local-bin-arm64
      - name: Download OpenSSL 3.5 shared library artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: openssl-lib/
          name: openssl-lib-arm64
      # Build and push an image using a new Dockerfile that copies the binaries from the downloaded artifacts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Publish to Registry
        uses: elgohr/Publish-Docker-Github-Action@1c2f28ccd9476e8a936ac9a1f287405504c93304 # v5
        env:
          COMMITHASH: ${{ github.sha }}
        with:
            name: connectedhomeip/chip-cert-bins
            tags: ${{ github.sha }}
            dockerfile: ./integrations/docker/images/chip-cert-bins/Dockerfile-ci
            username: ${{ secrets.CHIP_CERT_BINS_REGISTRY_USER }}
            password: ${{ secrets.CHIP_CERT_BINS_REGISTRY_TOKEN }}
            buildargs: COMMITHASH
            registry: docker.io
