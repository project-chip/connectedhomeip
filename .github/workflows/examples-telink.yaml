                  .environment/pigweed-venv/bin/python3 scripts/tools/memory/gh_sizes.py \
                    telink tlsr9118bdk40d thermostat-app \
                    out/telink-tlsr9118bdk40d-thermostat/zephyr/zephyr.elf \
