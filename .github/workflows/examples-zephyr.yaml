name: Build example - Zephyr

on:
    push:
        branches:
            - master
            - "v*-branch"
    pull_request:
    merge_group:

concurrency:
    group:
        ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name ==
        'pull_request' && github.event.number) || github.sha }}
    cancel-in-progress: true

env:
    CHIP_LOG_TIMESTAMPS: false
    CCACHE_SLOPPINESS: time_macros
    CCACHE_MAXSIZE: 500M
    CCACHE_IGNOREOPTIONS: "-specs=* --specs=*"

jobs:
    zephyr:
        name: all-devices-app (${{ matrix.board }}, ${{ matrix.toolchain }})
        runs-on: ubuntu-24.04
        # Enable after publishing the image and validating all board configurations.
        if: github.actor != 'restyled-io[bot]'

        container:
            image: ghcr.io/malbert-silabs/chip-build-zephyr:223

        permissions:
            contents: read
            actions: write

        env:
            CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
            CCACHE_KEY:
                ccache-zephyr-${{ matrix.board }}-${{ matrix.toolchain }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - board: xg26_rb4118a
                      toolchain: zephyr # gcc
                      build_dir: all-devices-zephyr-xg26
                      extra_args: -DFILE_SUFFIX=debug
                      sysbuild: --sysbuild

                    - board: siwx917_rb4338a
                      toolchain: zephyr
                      build_dir: all-devices-zephyr-siwx917
                      sysbuild: ""

                    - board: frdm_rw612
                      toolchain: zephyr # gcc
                      build_dir: all-devices-zephyr-frdm-rw612
                      extra_args: -DCONFIG_BUILD_ONLY_NO_BLOBS=y
                      sysbuild: ""

        steps:
            - name: Checkout Matter
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Restore ccache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.CCACHE_DIR }}
                  key: ${{ env.CCACHE_KEY }}

            - name: Configure ccache
              shell: bash
              run: |
                  set -euxo pipefail
                  mkdir -p "$CCACHE_DIR"
                  ccache --zero-stats
                  ccache --show-config

            - name: Configure Matter submodules
              shell: bash
              run: |
                  set -euxo pipefail
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  git -C "$GITHUB_WORKSPACE" submodule update --init --depth 1 --jobs 4 -- \
                      third_party/editline/repo \
                      third_party/jsoncpp/repo \
                      third_party/nlassert/repo \
                      third_party/nlio/repo \
                      third_party/uriparser/repo \
                      third_party/pigweed/repo \
                      third_party/silabs/matter_support
                  : > "$GITHUB_WORKSPACE/build_overrides/pigweed_environment.gni"

            - name: Build All-Devices App
              shell: bash
              working-directory: /opt/zephyrproject
              env:
                  ZEPHYR_TOOLCHAIN_VARIANT: ${{ matrix.toolchain }}
                  BUILD_DIR:
                      ${{ github.workspace }}/out/zephyr/${{ matrix.build_dir }}
              run: |
                  set -euxo pipefail
                  command -v ccache
                  west build -p always -b "${{ matrix.board }}" ${{ matrix.sysbuild }} --cmake-only \
                  "${GITHUB_WORKSPACE}/examples/all-devices-app/zephyr" \
                  -d "$BUILD_DIR" \
                  -- \
                  -DZEPHYR_TOOLCHAIN_VARIANT="${ZEPHYR_TOOLCHAIN_VARIANT}" \
                  -DZEPHYR_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
                  -DUSE_CCACHE=1 \
                  "${{ matrix.extra_args }}"

                  mapfile -t gn_args_files < <(find "$BUILD_DIR" -type f -path '*/modules/connectedhomeip/args.tmp')
                  test "${#gn_args_files[@]}" -gt 0
                  for gn_args_file in "${gn_args_files[@]}"; do
                    printf '%s\n' --arg-string pw_command_launcher ccache >> "$gn_args_file"
                  done
                  west build -d "$BUILD_DIR"

            - name: Show ccache statistics
              shell: bash
              run: |
                  if command -v ccache >/dev/null 2>&1; then
                      ccache --show-stats
                  fi

            - name: Clean ccache before saving
              if:
                  github.event_name == 'push' && github.ref ==
                  'refs/heads/master'
              run: ccache --cleanup

            - name: Delete existing ccache before save
              if:
                  github.event_name == 'push' && github.ref ==
                  'refs/heads/master'
              uses: ./.github/actions/delete-cache
              with:
                  cache-key: ${{ env.CCACHE_KEY }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Save ccache
              if:
                  github.event_name == 'push' && github.ref ==
                  'refs/heads/master'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.CCACHE_DIR }}
                  key: ${{ env.CCACHE_KEY }}

            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                  slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
