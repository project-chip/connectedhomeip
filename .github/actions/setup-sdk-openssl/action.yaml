name: Set up SDK OpenSSL
description: Select private OpenSSL for SDK targets without changing system library discovery
inputs:
  static:
    description: 'true for static OpenSSL 3.5, false for dynamic OpenSSL 3.5'
    required: true
runs:
  using: composite
  steps:
    - name: Select prebuilt OpenSSL installation
      shell: bash
      env:
        OPENSSL_STATIC: ${{ inputs.static }}
      run: |
        case "$OPENSSL_STATIC" in
          true|false) ;;
          *) echo "static must be true or false" >&2; exit 1 ;;
        esac
        # OpenSSL is built by the Dockerfile, never by individual CI jobs.
        dockerfile=integrations/docker/images/base/chip-build/Dockerfile
        version=$(sed -n 's/^ARG OPENSSL_VERSION=//p' "$dockerfile")
        test -n "$version"
        root=/opt/matter/openssl
        for file in lib/pkgconfig/openssl.pc lib/libssl.a lib/libcrypto.a lib/libssl.so lib/libcrypto.so; do
          if [[ ! -f "$root/$file" ]]; then
            echo "Missing prebuilt OpenSSL: $root/$file. Use an updated chip-build image." >&2
            exit 1
          fi
        done
        installed_version=$(PKG_CONFIG_PATH= PKG_CONFIG_LIBDIR="$root/lib/pkgconfig" pkg-config --modversion openssl)
        if [[ "$installed_version" != "$version" ]]; then
          echo "Expected prebuilt OpenSSL $version, found $installed_version. Update the chip-build image." >&2
          exit 1
        fi
        # Only the SDK GN configuration consumes these variables.
        echo "CHIP_OPENSSL_ROOT=$root" >> "$GITHUB_ENV"
        echo "CHIP_OPENSSL_STATIC=$OPENSSL_STATIC" >> "$GITHUB_ENV"
